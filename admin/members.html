<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Memberships | Le Shelter</title><link rel="stylesheet" href="/css/memberships.css"></head><body><main>
<header><a href="/admin/">Back to website dashboard</a><h1>Member administration</h1><p>Issue, renew and revoke Le Shelter membership IDs.</p></header>
<p id="message" role="status" aria-live="polite"></p>
<section id="login-panel"><h2>Membership administrator sign in</h2><p>Use your authorized Supabase account. Your existing website dashboard login is separate.</p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>
<section id="management" hidden><div class="actions"><h2>Members</h2><button id="refresh" type="button">Refresh</button><button id="logout" type="button">Sign out</button></div>
<details><summary>Add member</summary><form id="member-form"><label>Member number<input name="member_number" maxlength="40" placeholder="LSF-2026-0042" required></label><label>Full name<input name="full_name" maxlength="120" required></label><label>Role<input name="member_role" maxlength="80" placeholder="Volunteer" required></label><label>Expiry date<input name="expires_on" type="date" required></label><button>Create member ID</button></form></details><div id="members" class="member-grid"></div></section>
<dialog id="card-dialog"><article id="member-card"></article><div class="actions"><button id="print-card">Print / Save PDF</button><button id="close-card">Close</button></div></dialog>
</main><script type="module" src="/Javascript/memberships.js"></script></body></html>
